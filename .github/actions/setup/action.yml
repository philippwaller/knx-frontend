name: 'Setup Node.js and Install Dependencies'
description: 'Set up Node.js environment and install project dependencies with caching'

inputs:
  cache-key-prefix:
    description: 'Prefix of the dependency cache key. Jobs running in another environment, such as a container, need their own.'
    required: false
    default: 'knx-frontend-deps'

runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      id: setup-node
      with:
        node-version-file: ".nvmrc"
        cache: 'yarn'

    - name: Cache knx-frontend dependencies
      uses: actions/cache@v5
      with:
        path: |
          .yarn/cache
          .yarn/install-state.gz
          node_modules
        key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ steps.setup-node.outputs.node-version }}-
          ${{ inputs.cache-key-prefix }}-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: script/bootstrap
